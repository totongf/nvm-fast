version: '1.0'
name: update-nvm-cache
displayName: 更新 nvm 缓存

triggers:
  schedule:
    - cron: '25 4 * * ?'

variables:
  GITEE_OWNER_NAME: totongf
  GITEE_REPO_NAME: nvm-fast
  GITEE_BRANCH_NAME: master

stages:
  - stage:
    name: update
    displayName: 更新缓存
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: update_nvm_cache
        displayName: 更新 nvm 文件和元数据
        pythonVersion: 3.9
        commands:
          - |
            set -euo pipefail
            if [ -z "${NVM_GITEE_TOKEN:-}" ]; then
              echo "请先在 Gitee Go 流水线变量中添加 NVM_GITEE_TOKEN，并设置为私密变量"
              exit 1
            fi
            export GITEE_TOKEN="$NVM_GITEE_TOKEN"
            export GITEE_OWNER="$GITEE_OWNER_NAME"
            export GITEE_REPO="$GITEE_REPO_NAME"
            export GITEE_BRANCH="$GITEE_BRANCH_NAME"
            bash scripts/update-gitee-nvm.sh
